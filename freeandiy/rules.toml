# FreeANDIY rebrand rules for this repository (applied by freeandiy/tools/rebrand, after the
# patches in freeandiy/patches/). Modified-by: FreeANDIY (Free Andy Agency), 2026.
#
# Double-brace placeholders (e.g. this.name) come from branding.toml (`rebrand vars` lists them). Every rule has a
# minimum match count: when upstream renames or moves something, the rule fails loudly instead
# of silently leaving the old brand in place.
#
# Protected text: rules first swap text that must keep the upstream name (attribution, cargo
# package names, file names we keep) for @@...@@ markers, and the last rules swap them back.

# Copied files whose placeholders are filled in at the end.
templates = [
  "crates/ui-egui/src/freeandiy.rs",
  "crates/ui-egui/src/i18n/sk.tsv",
]

delete = [
  "docs/brand",                                  # ArtCraft marks: forks must remove them
  "assets/app-icon",                             # upstream's identity; ours is copied in below
  ".github/workflows/release.yml",               # reusable workflows of storytold/craft-common-actions (no licence)
  ".github/workflows/windows-arm64.yml",
  ".github/workflows/packaging-lint.yml",
  ".github/workflows/perf-nightly.yml",          # nightly jobs we don't run
  ".github/workflows/freebsd.yml",
  "packaging/icons.sh",                          # icons come from freeandiy/tools/make_icons.py
  "packaging/macos/dmg",                         # background and layout derived from upstream's icon; ours is copied in
]

# Translation catalogs: drop the ArtCraft/Discord entries (the strings are gone from the UI).
[[drop_lines]]
include = ["crates/ui-egui/src/i18n/*.tsv"]
regex = '^[^#\n]*(ArtCraft|Discord)'
min = 50

# ---------------------------------------------------------------------------------------------
# Identifiers, maintainers, URLs.

[[replace]]
name = "app id"
include = ["**"]
exclude = ["**/*.md", "docs/**", "book/**", "NOTICE", "ATTRIBUTION.md"]
find = "ai.storyteller.photocraft"
replace = "{{this.app_id}}"
min = 40

[[replace]]
name = "developer id"
include = ["packaging/**"]
find = "ai.storyteller"
replace = "{{brand.id_prefix}}"
min = 1

[[replace]]
name = "package maintainer"
include = ["packaging/**"]
find = "PhotoCraft maintainers <photocraft@storyteller.ai>"
replace = "{{brand.maintainer}}"
min = 1

[[replace]]
name = "upstream issues URL"
include = ["packaging/**", ".github/**"]
find = "https://github.com/storytold/photocraft/issues"
replace = "{{this.issues}}"
min = 0

[[replace]]
name = "upstream repository URL"
include = ["packaging/**", ".github/**"]
regex = 'https://github\.com/storytold/photocraft(/|"|<|$)'
replace = "{{this.github}}${1}"
min = 1

[[replace]]
name = "upstream repo slug (raw URLs, GITHUB_REPOSITORY defaults)"
include = ["packaging/**", ".github/**"]
regex = 'storytold/photocraft\b'
replace = "{{brand.github_owner}}/{{this.repo}}"
min = 2

[[replace]]
name = "upstream product page"
include = ["packaging/**", ".github/**"]
find = "https://getartcraft.com/apps/photocraft"
replace = "{{this.page}}"
min = 3

[[replace]]
name = "upstream Discord (packaging contact/help links)"
include = ["packaging/**"]
find = "https://discord.gg/artcraft"
replace = "{{this.issues}}"
min = 2

[[replace]]
name = "Crafting Apps"
include = ["crates/**/*.rs", "apps/**/*.rs", "packaging/**"]
find = "Crafting Apps"
replace = "{{brand.name}} apps"
min = 1

[[replace]]
name = "translation catalog notes: ArtCraft"
include = ["crates/ui-egui/src/i18n/*.tsv"]
find = "ArtCraft, "
replace = ""
min = 6

# ---------------------------------------------------------------------------------------------
# Protect text that keeps the upstream name.

[[replace]]
name = "protect: attribution 'the PhotoCraft authors'"
include = ["apps/*/build.rs", "packaging/**"]
find = "the PhotoCraft authors"
replace = "{{brand.owner}} and the @@UPSTREAM@@ authors"
min = 3

[[replace]]
name = "protect: test font names containing PhotoCraft"
include = ["apps/**/*.rs", "crates/**/*.rs"]
regex = 'DefinitelyMissingPhotoCraft'
replace = 'DefinitelyMissing@@UPSTREAM@@'
min = 1

[[replace]]
name = "protect: cargo -p / --package photocraft"
include = ["packaging/**", ".github/**", "Dockerfile"]
regex = '(-p|--package) photocraft'
replace = '$1 @@PKG@@'
min = 5

[[replace]]
name = "protect: crate names photocraft-<crate>"
include = ["packaging/**", ".github/**", "Dockerfile"]
regex = 'photocraft-(geom|color|cms|raster|doc|ops|psd|codecs|raw|affinity|compose|gpu|paint|algo|io|text|vector|format|automation|plugins|engine|ui-egui|testkit|tablet|heif|web|corpus)\b'
replace = '@@PKG@@-$1'
min = 1

[[replace]]
name = "protect: source paths apps/photocraft"
include = ["packaging/**", ".github/**", "Dockerfile"]
regex = '(apps[/\\])photocraft'
replace = '${1}@@PKG@@'
min = 1

[[replace]]
name = "protect: crate idents photocraft_"
include = ["packaging/**", ".github/**", "Dockerfile"]
find = "photocraft_"
replace = "@@PKG@@_"
min = 0

[[replace]]
name = "protect: WiX sources photocraft.wxs/.wxl"
include = ["packaging/**", ".github/**", "Dockerfile"]
regex = 'photocraft(\.wxs|\.en-us\.wxl)'
replace = '@@PKG@@${1}'
min = 1

# ---------------------------------------------------------------------------------------------
# The product name in the UI, messages, translations, packaging and the web page.

[[replace]]
name = "theme menu: FreeANDIY Light (all catalogs)"
include = ["crates/ui-egui/src/i18n/*.tsv"]
regex = '(?m)^([^\t\n]*)\tStudio Light Theme\t[^\n]*$'
replace = "${1}\tFreeANDIY Light Theme\tFreeANDIY Light"
min = 10

[[replace]]
name = "theme menu: FreeANDIY Dark (all catalogs)"
include = ["crates/ui-egui/src/i18n/*.tsv"]
regex = '(?m)^([^\t\n]*)\tPro Medium Gray Theme\t[^\n]*$'
replace = "${1}\tFreeANDIY Dark Theme\tFreeANDIY Dark"
min = 10

[[replace]]
name = "name + capital (identifier-like): PhotoCraftData, PhotoCraftVersion"
include = ["**/*.rs", "**/*.tsv", "packaging/**", "apps/photocraft-web/index.html"]
exclude = ["crates/codecs/tests/orientation.rs", "crates/cms/**"]
regex = 'PhotoCraft([A-Z])'
replace = 'FreeANDIYPhoto${1}'
skip_comments = ["//"]
min = 3

[[replace]]
name = "name + inflection (cs/pl/...): PhotoCraftu"
include = ["crates/ui-egui/src/i18n/*.tsv"]
regex = 'PhotoCraft[a-z]+'
replace = "{{this.name}}"
min = 1

[[replace]]
name = "product name PhotoCraft (Rust code, not comments)"
include = ["**/*.rs"]
exclude = ["crates/codecs/tests/orientation.rs", "crates/cms/**", "xtask/**"]
find = "PhotoCraft"
replace = "{{this.name}}"
skip_comments = ["//"]
min = 80

[[replace]]
name = "product name PhotoCraft"
include = ["**/*.tsv", "packaging/**", "apps/photocraft-web/index.html", ".github/**", "Dockerfile"]
exclude = ["crates/ui-egui/src/i18n/LICENSE-translations.txt", "**/*.md"]
find = "PhotoCraft"
replace = "{{this.name}}"
min = 300

# ---------------------------------------------------------------------------------------------
# Executables, settings directory, packaging file names.

[[replace]]
name = "settings dir (macOS/Windows)"
include = ["apps/photocraft/src/app_dirs.rs"]
find = 'Photocraft"'
replace = '{{this.name}}"'
min = 3

[[replace]]
name = "settings dir (Linux)"
include = ["apps/photocraft/src/app_dirs.rs"]
find = 'photocraft")'
replace = '{{this.repo}}")'
min = 2

[[replace]]
name = "test binaries CARGO_BIN_EXE_photocraft"
include = ["apps/**/*.rs"]
find = "CARGO_BIN_EXE_photocraft"
replace = "CARGO_BIN_EXE_{{this.repo}}"
min = 4

[[replace]]
name = "cli executable name in code"
include = ["apps/**/*.rs", "crates/**/*.rs"]
regex = '\bphotocraft-cli\b'
replace = "{{this.repo}}-cli"
min = 5

[[replace]]
name = "icon file paths in code (assets/app-icon/photocraft*)"
include = ["apps/**/*.rs", "crates/**/*.rs"]
find = "app-icon/photocraft"
replace = "app-icon/{{this.repo}}"
min = 3

[[replace]]
name = "title bar mark: the monogram, not the (unreadable at 20 pt) angel"
include = ["crates/ui-egui/src/brand.rs"]
find = "assets/app-icon/hicolor/128x128/apps/{{this.app_id}}.png"
replace = "assets/app-icon/{{this.repo}}-mark.png"
min = 1

[[replace]]
name = "test reading upstream's README tool list"
include = ["crates/ui-egui/src/state.rs"]
find = 'include_str!("../../../README.md")'
replace = 'include_str!("../../../docs/upstream-README.md")'
min = 1

[[replace]]
name = "tests: the UI font is IBM Plex Sans (font key)"
include = ["crates/ui-egui/src/prefs_ui.rs"]
find = 'font_data["Inter"]'
replace = 'font_data["IBMPlexSans"]'
min = 2

[[replace]]
name = "CLI help and exported LUT comment ('Photocraft')"
include = ["apps/photocraft-cli/src/lib.rs", "crates/engine/src/file_cmds.rs"]
regex = '(headless|Created by) Photocraft'
replace = '${1} {{this.name}}'
min = 2

[[replace]]
name = "windows exe resources"
include = ["apps/*/build.rs"]
regex = '"photocraft(\.exe)?"'
replace = '"{{this.repo}}${1}"'
min = 2

[[replace]]
name = "msi test: target exe"
include = ["apps/photocraft/src/app_icon.rs"]
find = "photocraft.exe"
replace = "{{this.repo}}.exe"
min = 1

[[replace]]
name = "packaging/CI: executables, file names, paths"
include = ["packaging/**", ".github/**", "Dockerfile"]
regex = 'photocraft'
replace = "{{this.repo}}"
min = 100

[[replace]]
name = "AppStream brand colour (light)"
include = ["packaging/linux/*.metainfo.xml.in"]
find = "#9fd0ff"
replace = "{{this.color}}"
min = 1

[[replace]]
name = "AppStream brand colour (dark)"
include = ["packaging/linux/*.metainfo.xml.in"]
find = "#1f64ba"
replace = "{{colors.black}}"
min = 1

[[replace]]
name = "MSI UpgradeCode (new GUID)"
include = ["packaging/windows/*.wxs"]
find = "D9660F32-2D0A-4ABE-B73D-17BE25F1542C"
replace = "{{this.msi_upgrade_code}}"
min = 1

[[replace]]
name = "MSI component GUID (new GUID)"
include = ["packaging/windows/*.wxs"]
find = "A6DE41B7-A80F-4C59-A17E-BB68065BF67E"
replace = "{{this.msi_component_guid}}"
min = 1

# ---------------------------------------------------------------------------------------------
# Restore protected text.

[[replace]]
name = "restore @@UPSTREAM@@"
include = ["**"]
find = "@@UPSTREAM@@"
replace = "{{this.upstream_name}}"
min = 2

[[replace]]
name = "restore @@PKG@@"
include = ["**"]
find = "@@PKG@@"
replace = "photocraft"
min = 10

# ---------------------------------------------------------------------------------------------

# Upstream's README stays available (a test reads its tool list); ours replaces it at the root.
[[rename]]
include = ["README.md"]
find = "README.md"
replace = "docs/upstream-README.md"
min = 1

[[rename]]
include = ["packaging/**"]
find = "ai.storyteller.photocraft"
replace = "{{this.app_id}}"
min = 5

