# FreeANDIY branding: the single source of truth for this fork.
# Modified-by: FreeANDIY (Free Andy Agency), 2026. New file, not part of upstream PhotoCraft.
#
# Everything outside freeandiy/ is generated from upstream + this directory by the rebrand tool
# (freeandiy/tools/rebrand). Never hand-edit upstream files on `main`; change this file, a rule in
# rules.toml or a patch in patches/ instead.

app = "photo" # which [apps.<id>] entry this repository builds

[brand]
name = "FreeANDIY"
owner = "Free Andy Agency"
domain = "freeandy.agency"
website = "https://freeandiy.freeandy.agency"
github_owner = "FreeAndy21"
id_prefix = "agency.freeandy"
maintainer = "FreeANDIY <licencie@freeandy.agency>"

# From Visual identity/tokens/colors.css. Accents are highlighters: use sparingly.
[colors]
black = "#231F20"
paper = "#F3F2F1"
white = "#FFFFFF"
rose = "#BE3E6B"
pink = "#EA9999"
azure = "#A3DDFA"
yellow = "#FFD966"
green = "#A7E48B"
ink_70 = "#231F20B3"
ink_50 = "#231F2080"
ink_30 = "#231F204D"
ink_15 = "#231F2026"
ink_08 = "#231F2014"

# From Visual identity/tokens/typography.css. All OFL 1.1, bundled under freeandiy/assets/fonts/.
[fonts]
mono = "IBM Plex Mono" # headings, short text, UI labels
sans = "IBM Plex Sans" # UI where mono is too wide
body = "Roboto"        # long-form text

# From Visual identity/tokens/spacing.css: print-flat, square, hairlines instead of shadows.
[shape]
radius = 0
radius_sm = 2
radius_md = 4
hairline = 1.0

# App family. `color` is the icon field; colour = category, monogram = app.
# Category hues come from the four highlighters; siblings vary saturation/lightness.
[apps.photo]
name = "FreeANDIY Photo"
repo = "freeandiy-photo"
upstream = "storytold/photocraft"
upstream_name = "PhotoCraft"
monogram = "Ph"
color = "#A3DDFA"
label = "black"
# Windows Installer ids: new GUIDs so FreeANDIY never upgrades or replaces a PhotoCraft install.
# Never change them once released (MSI upgrades match on the UpgradeCode).
msi_upgrade_code = "BACBA0AE-759D-4233-8188-373626E5857A"
msi_component_guid = "E9712E68-F674-4641-BE9D-8A3FA96C4832"

